<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boleka</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom Styles -->
    <style>
        /* Gradient background */
body {
    background: linear-gradient(180deg, #F8F9FA 0%, #EDEBFF 100%);
    color: #1F1F2E;
}

/* Navbar */
.navbar-dark.bg-dark {
    background: linear-gradient(90deg, #4B3CFB 0%, #6C63FF 100%) !important;
}

/* Cards */
.card {
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(75, 60, 251, 0.1);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(75, 60, 251, 0.15);
}

/* Buttons */
.btn-primary {
    background: linear-gradient(90deg, #4B3CFB 0%, #6C63FF 100%);
    border: none;
    font-weight: 500;
    padding: 10px 16px;
}
.btn-primary:hover {
    background: linear-gradient(90deg, #6C63FF 0%, #4B3CFB 100%);
}

.btn-outline-primary {
    border-color: #6C63FF;
    color: #4B3CFB;
}
.btn-outline-primary:hover {
    background: #6C63FF;
    color: #fff;
}

/* Headings */
h2, h3, h4 {
    font-weight: 600;
    color: #1F1F2E;
}

/* Table */
.table-dark {
    background-color: #4B3CFB !important;
}
.table-hover tbody tr:hover {
    background-color: rgba(75, 60, 251, 0.05);
}

/* Mobile tweaks */
@media (max-width: 576px) {
    .card {
        margin-bottom: 12px;
    }
    .btn {
        width: 100%;
        margin-bottom: 8px;
    }
}

    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-cash-stack me-2"></i>Boleka
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="bi bi-speedometer2 me-1"></i>Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/borrowers">
                            <i class="bi bi-people-fill me-1"></i>Borrowers
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/loans">
                            <i class="bi bi-journal-text me-1"></i>Loans
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/available-funds">
                            <i class="bi bi-wallet2 me-1"></i>Available Funds
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/loans/overdue">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>Overdue
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer>
        <small>Boleka &copy; {{ 2026 }} — Microlending Platform Prototype</small>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
