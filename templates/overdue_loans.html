{% extends "base.html" %}
{% block content %}

<div class="container mt-3">

    <h2 class="mb-3">
        <i class="bi bi-exclamation-triangle-fill me-2 text-danger"></i>Overdue Loans
    </h2>

    <p class="text-muted fst-italic mb-4">
        Prototype simulation — this list is manually defined.
    </p>

    <div class="card shadow-sm border-danger">
        <div class="card-body">

            <h5 class="mb-3 text-danger fw-semibold">Loans Past Due</h5>

            <!-- MOBILE SCROLL WRAPPER -->
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for l in loans %}
                        <tr>
                            <td>{{ l.id }}</td>
                            <td class="fw-bold text-danger">E{{ l.amount }}</td>
                            <td>{{ l.date }}</td>
                            <td>
                                <span class="badge bg-danger">Overdue</span>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Navigation -->
    <div class="mt-4">
        <a href="/loans" class="btn btn-outline-primary w-100 mb-2">
            <i class="bi bi-journal-text me-1"></i>Back to Loans
        </a>
        <a href="/borrowers" class="btn btn-outline-secondary w-100">
            <i class="bi bi-people-fill me-1"></i>Borrowers
        </a>
    </div>

</div>

<!-- MOBILE OPTIMIZATION -->
<style>
    @media (max-width: 576px) {

        h2 {
            font-size: 1.3rem;
        }

        .table-responsive {
            border-radius: 10px;
            overflow-x: auto;
        }

        table th, table td {
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .btn {
            font-size: 0.95rem;
            padding: 10px;
        }
    }

    /* Gradient and card styling to match your theme */
    body {
        background: linear-gradient(180deg, #F8F9FA 0%, #EDEBFF 100%);
    }

    .card {
        border-radius: 16px;
        box-shadow: 0 4px 12px rgba(75, 60, 251, 0.1);
    }

    .table-dark {
        background-color: #4B3CFB !important;
    }

    .badge.bg-danger {
        background-color: #FF5C5C !important;
    }
</style>

{% endblock %}
